name: portfolio-install-test (multi-distro + WSL2)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Debian 12"
            container: "debian:12"
            bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl git ca-certificates file"
          - name: "Ubuntu 22.04"
            container: "ubuntu:22.04"
            bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl git ca-certificates file"
          - name: "Ubuntu 24.04 (PEP 668)"
            container: "ubuntu:24.04"
            bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl git ca-certificates file"
          - name: "Fedora 41"
            container: "fedora:41"
            bootstrap: "dnf install -y curl git ca-certificates file shadow-utils"
          - name: "Alpine 3.19 (musl)"
            container: "alpine:3.19"
            bootstrap: "apk add --no-cache bash curl git ca-certificates file shadow"
          - name: "Arch (rolling)"
            container: "archlinux:latest"
            bootstrap: "pacman -Sy --noconfirm curl git ca-certificates file"
          - name: "Kali (rolling)"
            container: "kalilinux/kali-rolling"
            bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl git ca-certificates file"
    steps:
      - name: Bootstrap container
        run: |
          set -e
          ${{ matrix.bootstrap }}
      - uses: actions/checkout@v4
      - name: Mark workspace as Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run portfolio installer for cnr
        run: |
          set -e
          bash ./install-portfolio.sh --tools cnr --unattended --pipx

  wsl2-ubuntu:
    name: "WSL2 + Ubuntu 24.04"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up WSL2 + Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          additional-packages: curl git ca-certificates file python3 python3-venv python3-pip
      - name: Run portfolio installer in WSL for cnr
        shell: wsl-bash {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          bash ./install-portfolio.sh --tools cnr --unattended --pipx
